<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>苏轼宇宙</title>
  <link rel="icon" href="./assets/images/logo.svg" type="image/svg+xml" />
  <!-- 统一视觉系统样式层级 -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/views.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 全局东方诗词宇宙背景层 (解耦架构：纯CSS微光水墨降级 + 预留任务15.1 WebGL挂载点) -->
    <div id="universe-bg-fx" class="universe-bg-fx" aria-hidden="true">
      <div class="cosmos-stars-layer"></div>
      <div class="cosmos-mist-layer"></div>
      <div class="cosmos-ripple-layer"></div>
    </div>

    <!-- 统一顶部导航栏 (双安全区) -->
    <header id="app-header" class="app-header">
      <div class="nav-bar">
        <div id="nav-left" class="nav-bar-left">
          <!-- 动态返回按钮容器 -->
        </div>
        <div id="nav-title" class="nav-bar-title">苏轼宇宙</div>
        <div id="nav-right" class="nav-bar-right">
          <!-- 预留右侧拓展区 -->
        </div>
      </div>
    </header>

    <!-- 核心逻辑视图动态挂载主容器 (纵向平滑滚动) -->
    <main id="view-container" class="app-main"></main>

    <!-- 底部安全区容器 -->
    <footer class="app-footer"></footer>
  </div>

  <!-- 经典脚本依赖序列：严格保持依赖顺序与相对路径引用 -->
  <script src="./js/namespace.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/bridge.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/card_canvas.js"></script>
  <script src="./js/quiz.js"></script>
  <script src="./js/daily.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/views.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
