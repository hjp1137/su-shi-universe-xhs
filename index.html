<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>苏轼宇宙</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-container">
    <header class="header-bar">
      <span class="brand-badge">中国诗词宇宙 · 人物实验</span>
    </header>

    <main class="main-content">
      <div class="logo-wrapper">
        <img class="logo-image" src="./assets/images/logo.svg" alt="苏轼宇宙印记" />
      </div>
      <h1 class="title">苏轼宇宙</h1>
      <p class="slogan">遇到烦心事，先去东坡那里坐一会儿。</p>

      <div class="action-box">
        <button id="btn-explore" class="btn-primary" type="button">去东坡那里坐一会儿</button>
        <div class="feedback-card">
          <p id="feedback-text" class="feedback-text">点击上方按钮，听东坡说一句心宽之言</p>
        </div>
      </div>
    </main>

    <footer class="footer-info">
      <p class="footer-text">生活可以有风雨 · 但不必困在风雨里</p>
    </footer>
  </div>

  <!-- 经典脚本引入：严格保持依赖顺序与离线相对引用 -->
  <script src="./js/namespace.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/bridge.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
