<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F0E6" />
      <stop offset="100%" stop-color="#D9B978" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6FAFC2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#82B6A2" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- 背景深靛圆底 -->
  <circle cx="50" cy="50" r="46" fill="#0E1830" stroke="#6FAFC2" stroke-width="2" stroke-opacity="0.4" />
  <!-- 月相意象 -->
  <circle cx="50" cy="42" r="22" fill="url(#moonGrad)" />
  <circle cx="58" cy="38" r="19" fill="#0E1830" />
  <!-- 江水波纹意象 -->
  <path d="M 20 68 Q 35 60, 50 68 T 80 68" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 26 76 Q 38 70, 50 76 T 74 76" fill="none" stroke="#6FAFC2" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
</svg>
